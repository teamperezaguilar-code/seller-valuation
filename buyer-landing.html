<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimate How Much Home You Can Afford | Team Perez Aguilar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1C2B3A;
  --paper:#E8EDF2;
  --paper-raised:#F5F7FA;
  --brass:#A8823D;
  --brass-deep:#8A6B2E;
  --pine:#3D4F3F;
  --line:#C9D3DC;
  --white:#FFFDF8;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}

.wrap{max-width:960px;margin:0 auto;padding:0 24px;}

header{padding:20px 0;border-bottom:1px solid var(--line);}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.brandmark{font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;letter-spacing:0.01em;}
.brandmark span{color:var(--brass-deep);}
.header-right{display:flex;align-items:center;gap:18px;}
.eyebrow-nav{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--pine);display:none;}
@media(min-width:640px){.eyebrow-nav{display:block;}}

.social-links{display:flex;gap:14px;align-items:center;}
.social-link{color:#5a6472;display:flex;transition:color 0.15s ease;}
.social-link svg{width:18px;height:18px;display:block;}
.social-link:hover{color:var(--brass-deep);}

.lang-toggle{display:flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.05em;}
.lang-btn{padding:6px 12px;background:transparent;border:none;color:var(--ink);cursor:pointer;}
.lang-btn.active{background:var(--ink);color:var(--white);}
.lang-btn:focus-visible{outline:2px solid var(--brass);outline-offset:-2px;}

.hero{padding:64px 0 40px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:18px;}
h1{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:500;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.06;letter-spacing:-0.01em;max-width:14ch;margin-bottom:22px;}
.hero-sub{font-size:1.05rem;max-width:48ch;color:#39485a;margin-bottom:36px;}
.hero-sub strong{color:var(--ink);font-weight:600;}

.instrument{background:var(--paper-raised);border:1px solid var(--line);border-radius:2px;padding:28px;box-shadow:0 1px 0 var(--line);}
.instrument-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--pine);margin-bottom:18px;}

.calc-grid{display:grid;gap:16px;grid-template-columns:1fr;margin-bottom:8px;}
@media(min-width:640px){.calc-grid{grid-template-columns:1fr 1fr;}}
.calc-field label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;}
.calc-field input{
  width:100%;
  padding:13px 14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:0.95rem;
  border:1px solid var(--line);
  border-radius:1px;
  background:var(--white);
  color:var(--ink);
}
.calc-field input:focus{outline:none;border-color:var(--brass);}

.btn{padding:15px 26px;font-family:'Inter',sans-serif;font-weight:600;font-size:0.95rem;background:var(--ink);color:var(--white);border:none;border-radius:1px;cursor:pointer;transition:background 0.15s ease;width:100%;margin-top:8px;}
.btn:hover{background:var(--pine);}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--ink);}
.btn-secondary:hover{background:var(--ink);color:var(--white);}

.instrument-fine{font-size:0.8rem;color:#6b7280;margin-top:12px;}

#result{margin-top:0;max-height:0;overflow:hidden;transition:max-height 0.5s ease, margin-top 0.5s ease;}
#result.open{margin-top:24px;max-height:900px;}
.result-inner{border-top:1px solid var(--line);padding-top:22px;}
.result-range-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:8px;}
.result-range{font-family:'IBM Plex Mono',monospace;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:500;color:var(--ink);margin-bottom:6px;}
.result-sub{font-size:0.9rem;color:#5a6472;margin-bottom:18px;}
.result-note{font-size:0.85rem;color:#5a6472;max-width:54ch;margin-bottom:20px;}

.guide-gate{background:var(--ink);color:var(--white);padding:22px;border-radius:2px;margin-top:8px;}
.guide-gate-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#a9b6c6;margin-bottom:10px;}
.guide-gate-title{font-family:'Fraunces',serif;font-weight:500;font-size:1.2rem;margin-bottom:14px;}
.guide-gate input,.guide-gate select{width:100%;padding:13px 14px;font-family:'Inter',sans-serif;font-size:0.95rem;border:1px solid #45566b;border-radius:1px;background:rgba(255,255,255,0.05);color:var(--white);margin-bottom:10px;}
.guide-gate select option{background:var(--ink);color:var(--white);}
.guide-gate input::placeholder{color:#7c8ba0;}
.guide-consent{display:flex;gap:8px;align-items:flex-start;font-size:0.78rem;color:#a9b6c6;margin:10px 0;line-height:1.4;}
.guide-consent input{width:14px;height:14px;margin-top:2px;flex-shrink:0;}

#guide-confirmation{display:none;text-align:center;padding:12px 0;}
#guide-confirmation.open{display:block;}
.confirm-title{font-family:'Fraunces',serif;font-weight:500;font-size:1.1rem;margin-bottom:8px;}
.confirm-body{color:#cdd5df;font-size:0.9rem;}

.trust-bar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;margin-top:20px;}
.trust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px;}
@media(min-width:640px){.trust-grid{grid-template-columns:repeat(4,1fr);}}
.trust-num{font-family:'Fraunces',serif;font-weight:500;font-size:1.5rem;color:var(--brass-deep);margin-bottom:2px;}
.trust-label{font-size:0.8rem;color:#5a6472;}

.team{background:var(--ink);color:var(--white);padding:56px 0;}
.section-head{font-family:'Fraunces',serif;font-weight:500;font-size:1.7rem;margin-bottom:24px;max-width:22ch;color:var(--white);}
.team-photo-wrap{max-width:340px;border-radius:4px;overflow:hidden;border:2px solid var(--brass);margin-bottom:24px;}
.team-photo-wrap img{width:100%;height:auto;display:block;}
.team-photo-fallback{display:none;width:100%;height:220px;align-items:center;justify-content:center;background:var(--pine);color:var(--white);font-family:'IBM Plex Mono',monospace;font-size:0.8rem;letter-spacing:0.06em;text-transform:uppercase;}
.team-body{max-width:58ch;color:#cdd5df;font-size:1rem;margin-bottom:20px;}
.team-tags{display:flex;gap:10px;flex-wrap:wrap;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;border:1px solid #45566b;color:#a9b6c6;padding:6px 12px;border-radius:1px;}

footer{padding:32px 0 48px;}
.footer-fine{font-size:0.76rem;color:#7A8494;line-height:1.6;max-width:74ch;}
.footer-fine + .footer-fine{margin-top:10px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brandmark">Team Perez<span>&nbsp;Aguilar</span></div>
    <div class="header-right">
      <div class="eyebrow-nav">San Fernando · Santa Clarita · Palmdale · Lancaster</div>
      <div class="social-links">
        <a href="https://www.instagram.com/teamperezaguilar/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor" stroke="none"/></svg></a>
        <a href="https://www.facebook.com/TeamPerezAguilar" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg></a>
        <a href="https://www.tiktok.com/@teamperezaguilar" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.4 2.3 2 4.1 4.5 4.4v2.6c-1.6-.1-3.1-.6-4.5-1.5v6.2a5.3 5.3 0 1 1-5.3-5.3c.3 0 .6 0 .9.1v2.7a2.6 2.6 0 1 0 1.8 2.5V3h2.6z"/></svg></a>
        <a href="https://www.linkedin.com/in/teamperezaguilar" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="5.5" y="9.5" width="2.2" height="9" fill="currentColor"/><circle cx="6.6" cy="6" r="1.3" fill="currentColor"/><path d="M10.5 9.5h2.1v1.3c.5-.8 1.4-1.5 2.9-1.5 2.2 0 3.4 1.4 3.4 4.1v5.1h-2.2v-4.6c0-1.4-.5-2.3-1.7-2.3-1 0-1.6.7-1.8 1.3-.1.2-.1.5-.1.8v4.8h-2.2z" fill="currentColor"/></svg></a>
      </div>
      <div class="lang-toggle">
        <button class="lang-btn active" id="btn-en" data-lang="en">EN</button>
        <button class="lang-btn" id="btn-es" data-lang="es">ES</button>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow i18n" data-en="Free Affordability Estimate" data-es="Estimación Gratuita de Poder Adquisitivo"></div>
    <h1 class="i18n" data-en="Estimate how much home you can afford." data-es="Calcule cuánta casa puede pagar."></h1>
    <p class="hero-sub i18n" data-en="A quick, honest estimate based on your income and down payment, no credit check, no obligation." data-es="Una estimación rápida y honesta basada en sus ingresos y su enganche, sin revisión de crédito, sin obligación."></p>

    <div class="instrument">
      <p class="i18n" style="font-size:0.82rem;color:#6b7280;margin-bottom:16px;font-style:italic;" data-en="This calculator is for illustrative purposes only." data-es="Esta calculadora es solo para fines ilustrativos."></p>
      <div class="instrument-label i18n" data-en="Your numbers" data-es="Sus números"></div>

      <div class="calc-grid">
        <div class="calc-field">
          <label class="i18n" data-en="Annual household income" data-es="Ingreso anual del hogar"></label>
          <input type="text" id="field-income" inputmode="numeric" required>
        </div>
        <div class="calc-field">
          <label class="i18n" data-en="Estimated down payment" data-es="Enganche estimado"></label>
          <input type="text" id="field-downpayment" inputmode="numeric" required>
        </div>
        <div class="calc-field">
          <label class="i18n" data-en="Monthly debt payments (car, student loans, credit cards)" data-es="Pagos mensuales de deudas (auto, préstamos estudiantiles, tarjetas)"></label>
          <input type="text" id="field-debts" inputmode="numeric" required>
        </div>
        <div class="calc-field">
          <label class="i18n" data-en="Illustrative interest rate" data-es="Tasa de interés ilustrativa"></label>
          <input type="text" id="field-rate" inputmode="decimal" required>
        </div>
      </div>

      <button class="btn i18n" id="calc-btn" data-en="Calculate My Buying Power" data-es="Calcular Mi Poder de Compra"></button>
      <div class="instrument-fine i18n" data-en="Takes about 30 seconds. This is an estimate, your actual approval depends on full underwriting." data-es="Toma unos 30 segundos. Esto es una estimación, su aprobación real depende de una evaluación crediticia completa."></div>

      <div id="result">
        <div class="result-inner">
          <div class="result-range-label i18n" data-en="Estimated home price range" data-es="Rango estimado de precio de casa"></div>
          <div class="result-range" id="range-display">$0 – $0</div>
          <div class="result-sub i18n" data-en="Estimated monthly payment (principal, interest, taxes, insurance)" data-es="Pago mensual estimado (capital, interés, impuestos, seguro)"></div>
          <div class="result-range" id="payment-display" style="font-size:1.3rem;">$0/mo</div>
          <p style="font-size:0.82rem;color:#6b7280;font-style:italic;margin-bottom:14px;" class="i18n" data-en="This calculator is provided for informational and educational purposes only. Full disclosure below.*" data-es="Esta calculadora se proporciona únicamente con fines informativos y educativos. Divulgación completa a continuación.*"></p>
          <p class="result-note i18n" data-en="This estimate uses common lending guidelines and a general interest rate. Fernando can confirm your real rate and exact buying power with a quick pre-approval conversation, no cost, no obligation." data-es="Esta estimación usa pautas de préstamo comunes y una tasa de interés general. Fernando puede confirmar su tasa real y su poder de compra exacto con una breve conversación de preaprobación, sin costo, sin obligación."></p>

          <div class="guide-gate">
            <div class="guide-gate-title i18n" data-en="How Can We Help Today?" data-es="¿Cómo Podemos Ayudarle Hoy?"></div>

            <form id="guide-form">
              <select id="guide-help-type" required>
                <option value="" disabled selected class="i18n" data-en="Select one" data-es="Seleccione una opción"></option>
                <option value="First-time buyer's guide" class="i18n" data-en="First-time buyer's guide" data-es="Guía del comprador primerizo"></option>
                <option value="Send me a list of homes in my price range" class="i18n" data-en="Send me a list of homes in my price range" data-es="Envíenme una lista de casas en mi rango de precio"></option>
                <option value="Pre-qualification consultation" class="i18n" data-en="Pre-qualification consultation" data-es="Consulta de precalificación"></option>
              </select>
              <input type="text" id="guide-name" placeholder="Full name" required>
              <input type="email" id="guide-email" placeholder="Email" required>
              <input type="tel" id="guide-phone" placeholder="Phone" required>
              <select id="guide-area" required>
                <option value="" disabled selected class="i18n" data-en="Where are you looking to buy?" data-es="¿Dónde busca comprar?"></option>
                <option value="San Fernando Valley" class="i18n" data-en="San Fernando Valley" data-es="San Fernando Valley"></option>
                <option value="Santa Clarita Valley" class="i18n" data-en="Santa Clarita Valley" data-es="Santa Clarita Valley"></option>
                <option value="Palmdale" class="i18n" data-en="Palmdale" data-es="Palmdale"></option>
                <option value="Lancaster" class="i18n" data-en="Lancaster" data-es="Lancaster"></option>
                <option value="Not sure yet" class="i18n" data-en="Not sure yet" data-es="Aún no estoy seguro"></option>
              </select>
              <label class="guide-consent">
                <input type="checkbox" id="guide-sms-consent" required>
                <span class="i18n" data-en="I agree to receive texts and emails from Team Perez Aguilar about my request. Message and data rates may apply. Reply STOP to opt out." data-es="Acepto recibir mensajes de texto y correos de Team Perez Aguilar sobre mi solicitud. Pueden aplicar tarifas de mensajes y datos. Responda ALTO para dejar de recibir mensajes."></span>
              </label>
              <button type="submit" class="btn btn-secondary i18n" data-en="Submit" data-es="Enviar" style="background:transparent;border-color:var(--white);color:var(--white);"></button>
            </form>

            <div id="guide-confirmation">
              <div class="confirm-title i18n" data-en="Check your email" data-es="Revise su correo"></div>
              <p class="confirm-body i18n" data-en="We've got your request, and Silvia or Fernando will follow up within one business day." data-es="Ya recibimos su solicitud, y Silvia o Fernando se pondrán en contacto dentro de un día hábil."></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="wrap" style="padding:0 24px 40px;">
  <div style="background:var(--paper-raised);border:1px solid var(--line);border-radius:2px;padding:26px 28px;text-align:center;">
    <p style="font-size:1rem;color:var(--ink);margin-bottom:16px;" class="i18n"
      data-en="Ready to take the next step? Start your loan application online, it only takes a few minutes, and it goes straight to Fernando, who will personally follow up with you."
      data-es="¿Listo para dar el siguiente paso? Comience su solicitud de préstamo en línea, solo toma unos minutos, y llega directamente a Fernando, quien se pondrá en contacto con usted personalmente."></p>
    <a href="https://myloan.goalterra.com/homehub/signup/fperez@goalterra.com?from_mobile_share=true" target="_blank" rel="noopener noreferrer" class="btn i18n" style="display:inline-block;width:auto;padding:14px 32px;text-decoration:none;" data-en="Start My Loan Application" data-es="Comenzar Mi Solicitud de Préstamo"></a>
  </div>
</section>

<section class="trust-bar">
  <div class="wrap">
    <div class="trust-grid">
      <div class="trust-item">
        <div class="trust-num">40+</div>
        <div class="trust-label i18n" data-en="Years combined experience" data-es="Años de experiencia combinada"></div>
      </div>
      <div class="trust-item">
        <div class="trust-num">2</div>
        <div class="trust-label i18n" data-en="Licensed agent & loan officer, one team" data-es="Agente con licencia y oficial de préstamos, un mismo equipo"></div>
      </div>
      <div class="trust-item">
        <div class="trust-num">4</div>
        <div class="trust-label i18n" data-en="Markets served daily" data-es="Mercados atendidos a diario"></div>
      </div>
      <div class="trust-item">
        <div class="trust-num">0</div>
        <div class="trust-label i18n" data-en="Cost or obligation to you" data-es="Costo u obligación para usted"></div>
      </div>
    </div>
  </div>
</section>

<section class="team">
  <div class="wrap">
    <div class="section-head i18n" data-en="Who is behind this estimate" data-es="Quién está detrás de esta estimación"></div>
    <div class="team-photo-wrap">
      <img src="team-photo.jpg" alt="Silvia Aguilar and Fernando Perez, Team Perez Aguilar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="team-photo-fallback">Team Perez Aguilar</div>
    </div>
    <p class="team-body i18n"
      data-en="Your estimate is reviewed by Team Perez Aguilar, with over 40 years of combined experience across San Fernando Valley, Santa Clarita Valley, Palmdale, and Lancaster. Agent Silvia Aguilar works closely with loan officer Fernando Perez, so financing questions get answered by someone she already works with directly, not a stranger."
      data-es="Su estimación es revisada por Team Perez Aguilar, con más de 40 años de experiencia combinada en San Fernando Valley, Santa Clarita Valley, Palmdale y Lancaster. La agente Silvia Aguilar trabaja de cerca con el oficial de préstamos Fernando Pérez, para que sus preguntas de financiamiento sean respondidas por alguien con quien ella ya trabaja directamente, no un desconocido."></p>
    <div class="team-tags">
      <span class="tag i18n" data-en="First-time buyers" data-es="Compradores primerizos"></span>
      <span class="tag i18n" data-en="Relocations" data-es="Reubicaciones"></span>
      <span class="tag i18n" data-en="Resales" data-es="Reventas"></span>
      <span class="tag i18n" data-en="Short sales" data-es="Ventas cortas"></span>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">

    <div style="display:flex;gap:24px;align-items:center;margin-bottom:20px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7A8494" stroke-width="1.6" aria-label="Equal Housing Opportunity">
          <path d="M3 11l9-7 9 7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 10v9h14v-9" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="8.5" y1="14.5" x2="15.5" y2="14.5" stroke-linecap="round"/>
          <line x1="8.5" y1="17" x2="15.5" y2="17" stroke-linecap="round"/>
        </svg>
        <span style="font-size:0.68rem;color:#7A8494;line-height:1.2;max-width:120px;" class="i18n" data-en="Equal Housing Opportunity" data-es="Igualdad de Oportunidad de Vivienda"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7A8494" stroke-width="1.6" aria-label="Equal Opportunity Lender">
          <path d="M3 11l9-7 9 7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 10v9h14v-9" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="8.5" y1="14.5" x2="15.5" y2="14.5" stroke-linecap="round"/>
          <line x1="8.5" y1="17" x2="15.5" y2="17" stroke-linecap="round"/>
        </svg>
        <span style="font-size:0.68rem;color:#7A8494;line-height:1.2;max-width:120px;" class="i18n" data-en="Equal Opportunity Lender" data-es="Prestamista de Igualdad de Oportunidades"></span>
      </div>
    </div>

    <p class="footer-fine i18n"
      data-en="Equal Housing Opportunity. Equal Opportunity Lender. This is an estimate only, based on general lending guidelines, and is not a pre-approval, loan offer, or guarantee of financing. All loans are subject to credit approval, underwriting guidelines, and property appraisal. Actual buying power depends on full underwriting."
      data-es="Igualdad de Oportunidad de Vivienda. Prestamista de Igualdad de Oportunidades. Esto es solo una estimación, basada en pautas generales de préstamo, y no es una preaprobación, oferta de préstamo, ni garantía de financiamiento. Todos los préstamos están sujetos a aprobación de crédito, pautas de suscripción y tasación de la propiedad. El poder de compra real depende de una evaluación crediticia completa."></p>

    <p class="footer-fine i18n"
      data-en="Team Perez Aguilar"

<script>
let currentLang = 'en';

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.i18n').forEach(function(el){
    el.textContent = el.dataset[lang];
  });
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
  const privacyLink = document.getElementById('privacy-link');
  if(privacyLink){
    privacyLink.href = 'privacy-policy.html?lang=' + lang;
  }
}

document.getElementById('btn-en').addEventListener('click', function(){ applyLang('en'); });
document.getElementById('btn-es').addEventListener('click', function(){ applyLang('es'); });

function detectLang(){
  const params = new URLSearchParams(window.location.search);
  const urlLang = params.get('lang');
  if(urlLang === 'es' || urlLang === 'en'){ return urlLang; }
  const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  if(browserLang.startsWith('es')){ return 'es'; }
  return 'en';
}

applyLang(detectLang());

function parseNumber(str){
  const cleaned = str.replace(/[^0-9.]/g, '');
  return parseFloat(cleaned) || 0;
}

function formatCurrency(n){
  return '$' + Math.round(n).toLocaleString('en-US');
}

document.getElementById('calc-btn').addEventListener('click', function(){
  const incomeInput = document.getElementById('field-income');
  const downPaymentInput = document.getElementById('field-downpayment');
  const debtsInput = document.getElementById('field-debts');
  const rateInput = document.getElementById('field-rate');

  const income = parseNumber(incomeInput.value);
  const downPayment = parseNumber(downPaymentInput.value);
  const monthlyDebts = parseNumber(debtsInput.value);
  const rate = parseNumber(rateInput.value);

  const fields = [incomeInput, downPaymentInput, debtsInput, rateInput];
  fields.forEach(function(el){ el.style.borderColor = ''; });

  // Income, down payment, and rate must be greater than zero.
  // Debts is allowed to be zero (no debt), but the field itself can't be left blank.
  let firstInvalid = null;
  if(!income || income <= 0){ firstInvalid = incomeInput; }
  else if(!downPayment || downPayment <= 0){ firstInvalid = downPaymentInput; }
  else if(debtsInput.value.trim() === ''){ firstInvalid = debtsInput; }
  else if(!rate || rate <= 0){ firstInvalid = rateInput; }

  if(firstInvalid){
    firstInvalid.style.borderColor = '#A8823D';
    firstInvalid.focus();
    return;
  }

  const monthlyIncome = income / 12;
  const maxDTI = 0.43;
  const maxMonthlyHousing = (monthlyIncome * maxDTI) - monthlyDebts;

  const monthlyRate = (rate / 100) / 12;
  const numPayments = 360;
  const piFactor = (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) / (Math.pow(1 + monthlyRate, numPayments) - 1);
  const taxInsuranceMonthlyRate = 0.0011;

  const homePrice = Math.max(0, (maxMonthlyHousing + (downPayment * piFactor)) / (piFactor + taxInsuranceMonthlyRate));
  const loanAmount = Math.max(0, homePrice - downPayment);
  const monthlyPI = loanAmount * piFactor;
  const monthlyTaxInsurance = homePrice * taxInsuranceMonthlyRate;
  const totalMonthly = monthlyPI + monthlyTaxInsurance;

  const low = homePrice * 0.92;
  const high = homePrice * 1.05;

  document.getElementById('range-display').textContent = formatCurrency(low) + ' – ' + formatCurrency(high);
  document.getElementById('payment-display').textContent = formatCurrency(totalMonthly) + '/mo';

  document.getElementById('result').classList.add('open');
});

document.getElementById('guide-form').addEventListener('submit', async function(e){
  e.preventDefault();

  const submitBtn = document.querySelector('#guide-form button[type="submit"]');
  const originalText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = currentLang === 'es' ? 'Enviando…' : 'Sending…';

  const payload = {
    help_type: document.getElementById('guide-help-type').value,
    name: document.getElementById('guide-name').value.trim(),
    email: document.getElementById('guide-email').value.trim(),
    phone: document.getElementById('guide-phone').value.trim(),
    estimated_range: document.getElementById('range-display').textContent,
    area_of_interest: document.getElementById('guide-area').value,
    estimated_monthly_payment: document.getElementById('payment-display').textContent,
    language: currentLang,
    source: 'buyer-guide-request',
    _subject: 'Buyer guide request'
  };

  let ok = false;
  try{
    const response = await fetch('https://formspree.io/f/mrpzegna', {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    ok = response.ok;
  }catch(err){
    ok = false;
  }

  submitBtn.disabled = false;
  submitBtn.textContent = originalText;

  if(ok){
    document.getElementById('guide-form').style.display = 'none';
    document.getElementById('guide-confirmation').classList.add('open');
  } else {
    alert(currentLang === 'es' ? 'Algo salió mal. Intente de nuevo.' : 'Something went wrong. Please try again.');
  }
});
</script>

</body>
