<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Is Your Home Worth Today? | Team Perez Aguilar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1C2B3A;
  --paper:#E8EDF2;
  --paper-raised:#F5F7FA;
  --brass:#A8823D;
  --brass-deep:#8A6B2E;
  --pine:#3D4F3F;
  --line:#C9D3DC;
  --white:#FFFDF8;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}

.wrap{max-width:960px;margin:0 auto;padding:0 24px;}

/* header */
header{padding:20px 0;border-bottom:1px solid var(--line);}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.brandmark{font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;letter-spacing:0.01em;}
.brandmark span{color:var(--brass-deep);}
.header-right{display:flex;align-items:center;gap:18px;}
.eyebrow-nav{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.68rem;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--pine);
  display:none;
}
@media(min-width:640px){.eyebrow-nav{display:block;}}

.lang-toggle{
  display:flex;
  border:1px solid var(--ink);
  border-radius:2px;
  overflow:hidden;
  font-family:'IBM Plex Mono',monospace;
  font-size:0.72rem;
  letter-spacing:0.05em;
}
.lang-btn{
  padding:6px 12px;
  background:transparent;
  border:none;
  color:var(--ink);
  cursor:pointer;
}
.lang-btn.active{background:var(--ink);color:var(--white);}
.lang-btn:focus-visible{outline:2px solid var(--brass);outline-offset:-2px;}

/* hero */
.hero{padding:64px 0 40px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:18px;}
h1{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:500;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.06;letter-spacing:-0.01em;max-width:13ch;margin-bottom:22px;}
.hero-sub{font-size:1.05rem;max-width:48ch;color:#39485a;margin-bottom:36px;}
.hero-sub strong{color:var(--ink);font-weight:600;}

/* valuation instrument */
.instrument{background:var(--paper-raised);border:1px solid var(--line);border-radius:2px;padding:28px;box-shadow:0 1px 0 var(--line);}
.instrument-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--pine);margin-bottom:14px;}
.field-row{display:flex;gap:10px;flex-wrap:wrap;}
#address-input{flex:1 1 260px;padding:15px 16px;font-family:'Inter',sans-serif;font-size:1rem;border:1px solid var(--line);border-radius:1px;background:var(--white);color:var(--ink);}
#address-input:focus{outline:none;border-color:var(--brass);}
#address-input::placeholder{color:#7A8494;}
.btn{padding:15px 26px;font-family:'Inter',sans-serif;font-weight:600;font-size:0.95rem;background:var(--ink);color:var(--white);border:none;border-radius:1px;cursor:pointer;transition:background 0.15s ease;white-space:nowrap;}
.btn:hover{background:var(--pine);}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.instrument-fine{font-size:0.8rem;color:#6b7280;margin-top:12px;}

/* result panel */
#result{margin-top:0;max-height:0;overflow:hidden;transition:max-height 0.5s ease, margin-top 0.5s ease;}
#result.open{margin-top:20px;max-height:400px;}
.result-inner{border-top:1px solid var(--line);padding-top:20px;}
.result-range-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:8px;}
.result-range{font-family:'IBM Plex Mono',monospace;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:500;color:var(--ink);margin-bottom:6px;}
.result-note{font-size:0.88rem;color:#5a6472;max-width:54ch;margin-bottom:18px;}
.btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--ink);}
.btn-secondary:hover{background:var(--ink);color:var(--white);}

/* topo signature */
.topo-section{padding:20px 0 44px;}
.topo-caption{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:#7A8494;text-align:center;margin-top:10px;}

/* trust bar */
.trust-bar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;}
.trust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px;}
@media(min-width:640px){.trust-grid{grid-template-columns:repeat(4,1fr);}}
.trust-num{font-family:'Fraunces',serif;font-weight:500;font-size:1.5rem;color:var(--brass-deep);margin-bottom:2px;}
.trust-label{font-size:0.8rem;color:#5a6472;}

/* how it works */
.steps{padding:56px 0;}
.section-head{font-family:'Fraunces',serif;font-weight:500;font-size:1.7rem;margin-bottom:36px;max-width:22ch;}
.step-list{display:grid;gap:28px;}
@media(min-width:640px){.step-list{grid-template-columns:repeat(3,1fr);}}
.step{border-left:2px solid var(--brass);padding-left:16px;}
.step-order{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--brass-deep);margin-bottom:8px;}
.step-title{font-weight:600;margin-bottom:6px;}
.step-body{font-size:0.92rem;color:#5a6472;}

/* team */
.team{background:var(--ink);color:var(--white);padding:56px 0;}
.team .section-head{color:var(--white);}
.team-photo-wrap{
  max-width:340px;
  border-radius:4px;
  overflow:hidden;
  border:2px solid var(--brass);
  margin-bottom:24px;
}
.team-photo-wrap img{width:100%;height:auto;display:block;}
.team-photo-fallback{
  display:none;
  width:100%;height:220px;
  align-items:center;justify-content:center;
  background:var(--pine);
  color:var(--white);
  font-family:'IBM Plex Mono',monospace;
  font-size:0.8rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
}
.team-body{max-width:58ch;color:#cdd5df;font-size:1rem;margin-bottom:20px;}
.team-body strong{color:var(--white);}
.team-tags{display:flex;gap:10px;flex-wrap:wrap;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;border:1px solid #45566b;color:#a9b6c6;padding:6px 12px;border-radius:1px;}

/* footer */
footer{padding:32px 0 48px;}
.footer-fine{font-size:0.76rem;color:#7A8494;line-height:1.6;max-width:74ch;}
.footer-fine + .footer-fine{margin-top:10px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brandmark">Team Perez<span>&nbsp;Aguilar</span></div>
    <div class="header-right">
      <div class="eyebrow-nav">San Fernando · Santa Clarita · Palmdale · Lancaster</div>
      <div class="lang-toggle">
        <button class="lang-btn active" id="btn-en" data-lang="en">EN</button>
        <button class="lang-btn" id="btn-es" data-lang="es">ES</button>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow i18n" data-en="Free Instant Estimate" data-es="Estimación Gratuita al Instante"></div>
    <h1 class="i18n" data-en="What is your home worth right now?" data-es="¿Cuánto vale su casa ahora?"></h1>
    <p class="hero-sub i18n" data-en="Enter your address for a preliminary value range, refined by an agent who works your specific street, not just your zip code." data-es="Ingrese su dirección para obtener un promedio de valor preliminar, refinado por una agente que conoce su calle, no solo su código postal."></p>

    <div class="instrument">
      <div class="instrument-label i18n" data-en="Property address" data-es="Dirección de la propiedad"></div>
      <div class="field-row">
        <input id="address-input" type="text" autocomplete="off"
          data-en-placeholder="e.g. 1234 Ventura Blvd, Sherman Oaks, CA"
          data-es-placeholder="Ej. 1234 Ventura Blvd, Sherman Oaks, CA">
        <button class="btn i18n" id="estimate-btn" data-en="Get My Estimate" data-es="Obtener Mi Estimación"></button>
      </div>
      <div class="instrument-fine i18n" data-en="Takes about 30 seconds. No obligation, no showings, no pressure." data-es="Toma unos 30 segundos. Sin obligación, sin visitas, sin presión."></div>

      <div id="result">
        <div class="result-inner">
          <div class="result-range-label i18n" data-en="Preliminary range" data-es="Promedio preliminar"></div>
          <div class="result-range" id="range-display">$0 – $0</div>
          <p class="result-matched-address" id="matched-address" style="font-size:0.85rem;color:#5a6472;margin-bottom:10px;"></p>
          <p class="result-note i18n" data-en="This range is a starting point, not a listing price. Home condition, upgrades, and current buyer demand in your exact micro-market can move this significantly. An agent will review it against active and recently sold comps near you." data-es="Este promedio es un punto de partida, no un precio de venta. La condición de la casa, las mejoras y la demanda actual de compradores en su micro-mercado exacto pueden cambiar esto significativamente. Una agente lo revisará comparándolo con propiedades activas y vendidas recientemente cerca de usted."></p>
          <button class="btn btn-secondary i18n" id="cta-btn" data-en="Get the Full Report + Free Consultation" data-es="Obtener el Reporte Completo + Consulta Gratuita"></button>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="topo-section">
  <div class="wrap">
    <svg viewBox="0 0 900 220" width="100%" height="auto" role="img" aria-label="Four ridgelines representing the San Fernando Valley, Santa Clarita Valley, Palmdale, and Lancaster markets">
      <path d="M0,150 Q60,110 120,140 T240,130 T360,150" fill="none" stroke="#1C2B3A" stroke-width="2" opacity="0.85"/>
      <text x="10" y="172" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="#5a6472">SAN FERNANDO VALLEY</text>

      <path d="M180,170 Q260,120 340,155 T500,150 T620,168" fill="none" stroke="#3D4F3F" stroke-width="2" opacity="0.85"/>
      <text x="270" y="195" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="#5a6472">SANTA CLARITA VALLEY</text>

      <path d="M420,140 Q500,95 580,125 T740,118 T900,138" fill="none" stroke="#A8823D" stroke-width="2" opacity="0.9"/>
      <text x="560" y="145" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="#5a6472">PALMDALE</text>

      <path d="M540,185 Q640,150 740,178 T900,182" fill="none" stroke="#8A6B2E" stroke-width="2" opacity="0.7"/>
      <text x="760" y="205" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="#5a6472">LANCASTER</text>
    </svg>
    <div class="topo-caption i18n" data-en="Four markets. One team that actually works all of them." data-es="Cuatro mercados. Un equipo que realmente trabaja en los cuatro."></div>
  </div>
</section>

<section class="trust-bar">
  <div class="wrap">
    <div class="trust-grid">
      <div class="trust-item">
        <div class="trust-num">40+</div>
        <div class="trust-label i18n" data-en="Years combined experience" data-es="Años de experiencia combinada"></div>
      </div>
      <div class="trust-item">
        <div class="trust-num">2</div>
        <div class="trust-label i18n" data-en="Licensed agent & loan officer, one team" data-es="Agente con licencia y oficial de préstamos, un mismo equipo"></div>
      </div>
      <div class="trust-item">
        <div class="trust-num">4</div>
        <div class="trust-label i18n" data-en="Markets served daily" data-es="Mercados atendidos a diario"></div>
      </div>
      <div class="trust-item">
        <div class="trust-num">0</div>
        <div class="trust-label i18n" data-en="Cost or obligation to you" data-es="Costo u obligación para usted"></div>
      </div>
    </div>
  </div>
</section>

<section class="steps">
  <div class="wrap">
    <div class="section-head i18n" data-en="How the estimate works" data-es="Cómo funciona la estimación"></div>
    <div class="step-list">
      <div class="step">
        <div class="step-order">01</div>
        <div class="step-title i18n" data-en="Enter your address" data-es="Ingrese su dirección"></div>
        <div class="step-body i18n" data-en="We pull recent activity in your immediate area, not a citywide average." data-es="Analizamos la actividad reciente en su área inmediata, no un promedio de toda la ciudad."></div>
      </div>
      <div class="step">
        <div class="step-order">02</div>
        <div class="step-title i18n" data-en="See your range instantly" data-es="Vea su promedio al instante"></div>
        <div class="step-body i18n" data-en="A preliminary value range appears in seconds, right on this page." data-es="Un promedio de valor preliminar aparece en segundos, aquí mismo en esta página."></div>
      </div>
      <div class="step">
        <div class="step-order">03</div>
        <div class="step-title i18n" data-en="An agent refines it" data-es="Una agente lo refina"></div>
        <div class="step-body i18n" data-en="We walk the comps and condition with you and tighten the range, no cost, no pressure to list." data-es="Revisamos las comparables y la condición de su casa junto a usted para ajustar el promedio, sin costo ni presión para vender."></div>
      </div>
    </div>
  </div>
</section>

<section class="team">
  <div class="wrap">
    <div class="section-head i18n" data-en="Who is behind this estimate" data-es="Quién está detrás de esta estimación"></div>
    <div class="team-photo-wrap">
      <img src="team-photo.jpg" alt="Silvia Aguilar and Fernando Perez, Team Perez Aguilar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="team-photo-fallback">Team Perez Aguilar</div>
    </div>
    <p class="team-body i18n"
      data-en="Your estimate is reviewed by Team Perez Aguilar, with over 40 years of combined experience across San Fernando Valley, Santa Clarita Valley, Palmdale, and Lancaster. Agent Silvia Aguilar works closely with loan officer Fernando Perez, so financing questions get answered by someone she already works with directly, not a stranger."
      data-es="Su estimación es revisada por Team Perez Aguilar, con más de 40 años de experiencia combinada en San Fernando Valley, Santa Clarita Valley, Palmdale y Lancaster. La agente Silvia Aguilar trabaja de cerca con el oficial de préstamos Fernando Pérez, para que sus preguntas de financiamiento sean respondidas por alguien con quien ella ya trabaja directamente, no un desconocido."></p>
    <div class="team-tags">
      <span class="tag i18n" data-en="First-time buyers" data-es="Compradores primerizos"></span>
      <span class="tag i18n" data-en="Relocations" data-es="Reubicaciones"></span>
      <span class="tag i18n" data-en="Resales" data-es="Reventas"></span>
      <span class="tag i18n" data-en="Short sales" data-es="Ventas cortas"></span>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p class="footer-fine i18n"
      data-en="Equal Housing Opportunity. This estimate is a preliminary automated range based on available market data and is not an appraisal or a formal listing recommendation. Actual market value can only be determined through an in-person evaluation."
      data-es="Igualdad de Oportunidad de Vivienda. Esta estimación es un promedio automatizado preliminar basado en datos de mercado disponibles y no constituye una tasación ni una recomendación formal de precio de venta. El valor real de mercado solo puede determinarse mediante una evaluación en persona."></p>
    <p class="footer-fine i18n"
      data-en="Team Perez Aguilar | Silvia Aguilar, DRE License #01745879 | Loan services provided by Fernando Perez, NMLS #1011109 | San Fernando Realty, 458 N Maclay Ave, San Fernando, CA 91340 | Licensed in the State of California."
      data-es="Team Perez Aguilar | Silvia Aguilar, Licencia DRE #01745879 | Servicios de préstamo proporcionados por Fernando Pérez, NMLS #1011109 | San Fernando Realty, 458 N Maclay Ave, San Fernando, CA 91340 | Con licencia en el Estado de California."></p>
    <p class="footer-fine"><a href="privacy-policy.html" id="privacy-link" class="i18n" data-en="Privacy Policy" data-es="Política de Privacidad" style="color:inherit;"></a></p>
  </div>
</footer>

<script>
let currentLang = 'en';

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.i18n').forEach(function(el){
    el.textContent = el.dataset[lang];
  });
  const addressInput = document.getElementById('address-input');
  addressInput.placeholder = addressInput.dataset[lang + 'Placeholder'];

  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');

  const privacyLink = document.getElementById('privacy-link');
  if(privacyLink){
    privacyLink.href = 'privacy-policy.html?lang=' + lang;
  }
}

document.getElementById('btn-en').addEventListener('click', function(){ applyLang('en'); });
document.getElementById('btn-es').addEventListener('click', function(){ applyLang('es'); });

function detectLang(){
  // 1. Explicit URL param wins, e.g. ?lang=es — use this on Spanish ad creative
  const params = new URLSearchParams(window.location.search);
  const urlLang = params.get('lang');
  if(urlLang === 'es' || urlLang === 'en'){
    return urlLang;
  }
  // 2. Fall back to the visitor's browser language
  const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  if(browserLang.startsWith('es')){
    return 'es';
  }
  // 3. Default to English
  return 'en';
}

applyLang(detectLang());

function formatCurrency(n){
  return '$' + Math.round(n).toLocaleString('en-US');
}

const VALUATION_ENDPOINT = 'https://seller-valuation-api.vercel.app/api/valuation';

function animateRange(low, high){
  const rangeEl = document.getElementById('range-display');
  const duration = 700;
  const start = performance.now();

  function tick(now){
    const progress = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - progress, 3);
    rangeEl.textContent = formatCurrency(low * eased) + ' – ' + formatCurrency(high * eased);
    if(progress < 1){
      requestAnimationFrame(tick);
    }
  }
  requestAnimationFrame(tick);
}

document.getElementById('estimate-btn').addEventListener('click', async function(){
  const input = document.getElementById('address-input');
  const address = input.value.trim();
  if(!address){
    input.focus();
    input.style.borderColor = '#A8823D';
    return;
  }
  input.style.borderColor = '';

  const btn = document.getElementById('estimate-btn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = currentLang === 'es' ? 'Buscando…' : 'Looking up…';

  try {
    const response = await fetch(VALUATION_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address: address })
    });

    btn.disabled = false;
    btn.textContent = originalText;

    if(!response.ok){
      if(response.status === 404){
        const msg = currentLang === 'es'
          ? 'No pudimos encontrar esa dirección. Intente incluir ciudad y estado, ej. "123 Calle Principal, Sherman Oaks, CA".'
          : 'We couldn\'t find that address. Try including city and state, e.g. "123 Main St, Sherman Oaks, CA".';
        alert(msg);
        return;
      }
      throw new Error('Lookup failed');
    }

    const data = await response.json();
    const result = document.getElementById('result');
    animateRange(data.low, data.high);

    const matchedEl = document.getElementById('matched-address');
    if(data.matchedAddress){
      const label = currentLang === 'es' ? 'Estimación para: ' : 'Estimate for: ';
      matchedEl.textContent = label + data.matchedAddress;
      matchedEl.style.display = 'block';
    } else {
      matchedEl.textContent = '';
      matchedEl.style.display = 'none';
    }

    result.classList.add('open');

  } catch(err) {
    btn.disabled = false;
    btn.textContent = originalText;
    const msg = currentLang === 'es'
      ? 'Algo salió mal al buscar su estimación. Por favor intente de nuevo.'
      : 'Something went wrong getting your estimate. Please try again.';
    alert(msg);
  }
});



document.getElementById('cta-btn').addEventListener('click', function(){
  const address = document.getElementById('address-input').value.trim();
  const params = new URLSearchParams();
  params.set('lang', currentLang);
  if(address){
    params.set('address', address);
  }
  window.location.href = 'booking-page.html?' + params.toString();
});
</script>


</body>
</html>
