<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Free Consultation | Team Perez Aguilar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1C2B3A;
  --paper:#E8EDF2;
  --paper-raised:#F5F7FA;
  --brass:#A8823D;
  --brass-deep:#8A6B2E;
  --pine:#3D4F3F;
  --line:#C9D3DC;
  --white:#FFFDF8;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}

.wrap{max-width:960px;margin:0 auto;padding:0 24px;}

/* header */
header{padding:20px 0;border-bottom:1px solid var(--line);}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.brandmark{font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;letter-spacing:0.01em;color:inherit;text-decoration:none;}
.brandmark span{color:var(--brass-deep);}
.header-right{display:flex;align-items:center;gap:18px;}
.eyebrow-nav{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--pine);display:none;}
@media(min-width:640px){.eyebrow-nav{display:block;}}

.lang-toggle{display:flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.05em;}
.lang-btn{padding:6px 12px;background:transparent;border:none;color:var(--ink);cursor:pointer;}
.lang-btn.active{background:var(--ink);color:var(--white);}
.lang-btn:focus-visible{outline:2px solid var(--brass);outline-offset:-2px;}

/* hero */
.hero{padding:56px 0 36px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:18px;}
h1{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:500;font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.08;letter-spacing:-0.01em;max-width:15ch;margin-bottom:20px;}
.hero-sub{font-size:1.05rem;max-width:52ch;color:#39485a;}
.hero-sub strong{color:var(--ink);font-weight:600;}

/* single column layout: form panel only, sidebar removed */
.booking-grid{
  display:grid;
  gap:32px;
  padding:8px 0 48px;
  max-width:620px;
  margin:0 auto;
}

/* form panel */
.form-panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:2px;padding:28px;}
.panel-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--pine);margin-bottom:20px;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;}
.field input[type="text"],
.field input[type="tel"],
.field input[type="email"],
.field input[type="date"],
.field textarea{
  width:100%;
  padding:13px 14px;
  font-family:'Inter',sans-serif;
  font-size:0.95rem;
  border:1px solid var(--line);
  border-radius:1px;
  background:var(--white);
  color:var(--ink);
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brass);}
.field textarea{resize:vertical;min-height:80px;}

.radio-row{display:flex;gap:10px;flex-wrap:wrap;}
.radio-pill{position:relative;}
.radio-pill input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0;}
.radio-pill span{
  display:block;
  padding:10px 16px;
  border:1px solid var(--line);
  border-radius:20px;
  font-size:0.85rem;
  background:var(--white);
  transition:all 0.15s ease;
}
.radio-pill input:checked + span{background:var(--ink);color:var(--white);border-color:var(--ink);}
.radio-pill input:focus-visible + span{outline:2px solid var(--brass);outline-offset:2px;}

.field-hint{font-size:0.78rem;color:#7A8494;margin-top:6px;}

.btn{padding:15px 26px;font-family:'Inter',sans-serif;font-weight:600;font-size:0.95rem;background:var(--ink);color:var(--white);border:none;border-radius:1px;cursor:pointer;transition:background 0.15s ease;width:100%;}
.btn:hover{background:var(--pine);}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

.consent-fine{font-size:0.76rem;color:#6b7280;margin-top:14px;line-height:1.5;}

.sms-consent-row{margin-bottom:18px;}
.sms-consent-label{
  display:flex;
  gap:10px;
  align-items:flex-start;
  font-size:0.85rem;
  color:#39485a;
  cursor:pointer;
  line-height:1.5;
}
.sms-consent-label input[type="checkbox"]{
  margin-top:3px;
  flex-shrink:0;
  width:16px;
  height:16px;
  cursor:pointer;
  accent-color:var(--ink);
}

/* confirmation state */
#confirmation{display:none;text-align:center;padding:20px 0;}
#confirmation.open{display:block;}
.confirm-mark{
  width:48px;height:48px;border-radius:50%;
  background:var(--pine);color:var(--white);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-size:1.4rem;
  margin:0 auto 18px;
}
.confirm-title{font-family:'Fraunces',serif;font-weight:500;font-size:1.4rem;margin-bottom:10px;}
.confirm-body{color:#5a6472;max-width:40ch;margin:0 auto;font-size:0.95rem;}

/* sidebar */
.sidebar-block{margin-bottom:28px;}
.sidebar-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:12px;}
.sidebar-list{list-style:none;}
.sidebar-list li{
  display:flex;gap:10px;
  font-size:0.92rem;color:#39485a;
  padding:10px 0;
  border-bottom:1px solid var(--line);
}
.sidebar-list li:last-child{border-bottom:none;}
.sidebar-list li::before{content:"—";color:var(--brass);flex-shrink:0;}

.sidebar-quote{
  background:var(--ink);color:var(--white);
  padding:22px;border-radius:2px;
  font-family:'Fraunces',serif;
  font-size:1.05rem;
  line-height:1.4;
}
.sidebar-quote-attr{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.72rem;
  color:#a9b6c6;
  margin-top:14px;
  letter-spacing:0.04em;
}

/* trust bar */
.trust-bar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;}
.trust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px;}
@media(min-width:640px){.trust-grid{grid-template-columns:repeat(4,1fr);}}
.trust-num{font-family:'Fraunces',serif;font-weight:500;font-size:1.5rem;color:var(--brass-deep);margin-bottom:2px;}
.trust-label{font-size:0.8rem;color:#5a6472;}

/* footer */
footer{padding:32px 0 48px;}
.footer-fine{font-size:0.76rem;color:#7A8494;line-height:1.6;max-width:74ch;}
.footer-fine + .footer-fine{margin-top:10px;}
.social-links{display:flex;gap:14px;align-items:center;}
.social-link{
  color:#5a6472;
  display:flex;
  transition:color 0.15s ease;
}
.social-link svg{width:22px;height:22px;display:block;}
.social-link:hover{color:var(--brass-deep);}

.compliance-badges{display:flex;flex-wrap:wrap;gap:24px;margin:22px 0;align-items:center;}
.compliance-badge{display:flex;gap:12px;align-items:center;max-width:340px;min-height:56px;}
.compliance-badge svg{flex:none;width:34px;height:34px;}
.compliance-badge-title{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink);margin-bottom:4px;font-weight:600;}
.compliance-badge-body{font-size:0.76rem;color:#7A8494;line-height:1.5;}
.compliance-badge-logo-item{max-width:none;align-items:center;min-height:56px;}
.compliance-logo-img{height:56px;width:auto;display:block;}
</style>

<script>
let currentLang = 'en';

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.i18n').forEach(function(el){
    el.textContent = el.dataset[lang];
  });
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');

  const privacyLink = document.getElementById('privacy-link');
  if(privacyLink){
    privacyLink.href = 'privacy-policy.html?lang=' + lang;
  }
}

document.getElementById('btn-en').addEventListener('click', function(){ applyLang('en'); });
document.getElementById('btn-es').addEventListener('click', function(){ applyLang('es'); });

function detectLang(){
  const params = new URLSearchParams(window.location.search);
  const urlLang = params.get('lang');
  if(urlLang === 'es' || urlLang === 'en'){
    return urlLang;
  }
  const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  if(browserLang.startsWith('es')){
    return 'es';
  }
  return 'en';
}

applyLang(detectLang());

// prefill address from the valuation page if it's passed along, e.g. booking.html?address=123+Main+St
const urlParams = new URLSearchParams(window.location.search);
const prefillAddress = urlParams.get('address');
if(prefillAddress){
  document.getElementById('field-address').value = prefillAddress;
}

const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mrpzegna';

document.getElementById('booking-form').addEventListener('submit', async function(e){
  e.preventDefault();

  const submitBtn = document.querySelector('#booking-form button[type="submit"]');
  const originalBtnText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = currentLang === 'es' ? 'Enviando…' : 'Sending…';

  const name = document.getElementById('field-name').value.trim();
  const payload = {
    name: name,
    address: document.getElementById('field-address').value.trim(),
    phone: document.getElementById('field-phone').value.trim(),
    email: document.getElementById('field-email').value.trim(),
    preferred_time_of_day: document.querySelector('input[name="timeofday"]:checked').value,
    message: document.getElementById('field-message').value.trim(),
    timeline_to_sell: document.getElementById('field-timeline').value,
    sms_consent: document.getElementById('field-sms-consent').checked,
    language: currentLang,
    _subject: 'New listing consultation request — ' + name
  };

  let submissionOk = false;
  try{
    const response = await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });
    submissionOk = response.ok;
  }catch(err){
    submissionOk = false;
  }

  submitBtn.disabled = false;
  submitBtn.textContent = originalBtnText;

  if(submissionOk){
    const confirmBody = document.querySelector('#confirmation .confirm-body');
    const template = currentLang === 'es'
      ? 'Gracias, {name}. Silvia se pondrá en contacto dentro de un día hábil.'
      : 'Thanks, {name}. Silvia will reach out within one business day.';
    confirmBody.textContent = template.replace('{name}', name);

    document.getElementById('booking-form').style.display = 'none';
    document.getElementById('confirmation').classList.add('open');
  } else {
    const errorMsg = currentLang === 'es'
      ? 'Algo salió mal al enviar su solicitud. Por favor intente de nuevo, o llámenos directamente.'
      : 'Something went wrong sending your request. Please try again, or call us directly.';
    alert(errorMsg);
  }
});
</script>
