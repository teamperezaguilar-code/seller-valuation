<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1C2B3A;
  --paper:#E8EDF2;
  --paper-raised:#F5F7FA;
  --brass:#A8823D;
  --brass-deep:#8A6B2E;
  --pine:#3D4F3F;
  --line:#C9D3DC;
  --white:#FFFDF8;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}

.wrap{max-width:960px;margin:0 auto;padding:0 24px;}

header{padding:20px 0;border-bottom:1px solid var(--line);}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.brandmark{font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;letter-spacing:0.01em;}
.brandmark span{color:var(--brass-deep);}
.header-right{display:flex;align-items:center;gap:18px;}
.eyebrow-nav{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--pine);display:none;}
@media(min-width:640px){.eyebrow-nav{display:block;}}

.social-links{display:flex;gap:14px;align-items:center;}
.social-link{color:#5a6472;display:flex;transition:color 0.15s ease;}
.social-link svg{width:18px;height:18px;display:block;}
.social-link:hover{color:var(--brass-deep);}

.lang-toggle{display:flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.05em;}
.lang-btn{padding:6px 12px;background:transparent;border:none;color:var(--ink);cursor:pointer;}
.lang-btn.active{background:var(--ink);color:var(--white);}
.lang-btn:focus-visible{outline:2px solid var(--brass);outline-offset:-2px;}

.hero{padding:64px 0 40px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:18px;}
h1{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:500;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.06;letter-spacing:-0.01em;max-width:15ch;margin-bottom:22px;}
.hero-sub{font-size:1.05rem;max-width:48ch;color:#39485a;margin-bottom:16px;}
.hero-sub strong{color:var(--ink);font-weight:600;}
.hero-context{font-size:0.88rem;max-width:52ch;color:#5a6472;margin-bottom:36px;}
.hero-context strong{color:var(--brass-deep);}

.instrument{background:var(--paper-raised);border:1px solid var(--line);border-radius:2px;padding:28px;box-shadow:0 1px 0 var(--line);}
.instrument-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--pine);margin-bottom:18px;}

.elig-list{display:grid;gap:10px;margin-bottom:8px;}
.elig-item{
  display:flex;
  gap:12px;
  align-items:flex-start;
  font-size:0.92rem;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:1px;
  padding:13px 14px;
  cursor:pointer;
  transition:border-color 0.15s ease;
}
.elig-item:hover{border-color:var(--brass);}
.elig-item input{margin-top:3px;flex-shrink:0;width:16px;height:16px;accent-color:var(--ink);}

.btn{padding:15px 26px;font-family:'Inter',sans-serif;font-weight:600;font-size:0.95rem;background:var(--ink);color:var(--white);border:none;border-radius:1px;cursor:pointer;transition:background 0.15s ease;width:100%;margin-top:8px;}
.btn:hover{background:var(--pine);}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--ink);}
.btn-secondary:hover{background:var(--ink);color:var(--white);}

.instrument-fine{font-size:0.8rem;color:#6b7280;margin-top:12px;}

#result{margin-top:0;max-height:0;overflow:hidden;transition:max-height 0.5s ease, margin-top 0.5s ease;}
#result.open{margin-top:24px;max-height:1000px;}
.result-inner{border-top:1px solid var(--line);padding-top:22px;}
.result-range-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:8px;}
.result-headline{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.25rem,3vw,1.6rem);color:var(--ink);margin-bottom:14px;line-height:1.25;}
.result-note{font-size:0.85rem;color:#5a6472;max-width:54ch;margin-bottom:20px;}

.guide-gate{background:var(--ink);color:var(--white);padding:22px;border-radius:2px;margin-top:8px;}
.guide-gate-label{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#a9b6c6;margin-bottom:10px;}
.guide-gate-title{font-family:'Fraunces',serif;font-weight:500;font-size:1.2rem;margin-bottom:14px;}
.guide-gate input,.guide-gate select{width:100%;padding:13px 14px;font-family:'Inter',sans-serif;font-size:0.95rem;border:1px solid #45566b;border-radius:1px;background:rgba(255,255,255,0.05);color:var(--white);margin-bottom:10px;}
.guide-gate select option{background:var(--ink);color:var(--white);}
.guide-gate input::placeholder{color:#7c8ba0;}
.guide-consent{display:flex;gap:8px;align-items:flex-start;font-size:0.78rem;color:#a9b6c6;margin:10px 0;line-height:1.4;}
.guide-consent input{width:14px;height:14px;margin-top:2px;flex-shrink:0;}

#guide-confirmation{display:none;text-align:center;padding:12px 0;}
#guide-confirmation.open{display:block;}
.confirm-title{font-family:'Fraunces',serif;font-weight:500;font-size:1.1rem;margin-bottom:8px;}
.confirm-body{color:#cdd5df;font-size:0.9rem;}

.trust-bar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;margin-top:20px;}
.trust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px;}
@media(min-width:640px){.trust-grid{grid-template-columns:repeat(4,1fr);}}
.trust-num{font-family:'Fraunces',serif;font-weight:500;font-size:1.5rem;color:var(--brass-deep);margin-bottom:2px;}
.trust-label{font-size:0.8rem;color:#5a6472;}

.team{background:var(--ink);color:var(--white);padding:56px 0;}
.section-head{font-family:'Fraunces',serif;font-weight:500;font-size:1.7rem;margin-bottom:24px;max-width:22ch;color:var(--white);}
.team-photo-wrap{max-width:340px;border-radius:4px;overflow:hidden;border:2px solid var(--brass);margin-bottom:24px;}
.team-photo-wrap img{width:100%;height:auto;display:block;}
.team-photo-fallback{display:none;width:100%;height:220px;align-items:center;justify-content:center;background:var(--pine);color:var(--white);font-family:'IBM Plex Mono',monospace;font-size:0.8rem;letter-spacing:0.06em;text-transform:uppercase;}
.team-body{max-width:58ch;color:#cdd5df;font-size:1rem;margin-bottom:20px;}
.team-tags{display:flex;gap:10px;flex-wrap:wrap;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;border:1px solid #45566b;color:#a9b6c6;padding:6px 12px;border-radius:1px;}

footer{padding:32px 0 48px;}
.footer-fine{font-size:0.76rem;color:#7A8494;line-height:1.6;max-width:74ch;}
.footer-fine + .footer-fine{margin-top:10px;}
</style>

<script>
let currentLang = 'en';
let lastEligTier = null; // null = no result yet, 0/1/2 once computed

function renderHeroContext(){
  document.querySelectorAll('.hero-context').forEach(function(el){
    el.innerHTML = el.dataset[currentLang];
  });
}

function eligMessages(tier){
  const messages = {
    en: {
      2: "Based on your answers, a short sale is likely available to you. Let's confirm the details.",
      1: "You may qualify for a short sale, or another option that protects your credit even better. Worth a quick conversation.",
      0: "A short sale may not be the first option for you, but there are usually other ways to protect your credit and your equity. Let's talk through what fits."
    },
    es: {
      2: "Según sus respuestas, es probable que una venta corta esté disponible para usted. Confirmemos los detalles.",
      1: "Es posible que califique para una venta corta, u otra opción que proteja aún mejor su crédito. Vale la pena una breve conversación.",
      0: "Es posible que una venta corta no sea la primera opción para usted, pero generalmente hay otras formas de proteger su crédito y su plusvalía. Hablemos sobre lo que más le conviene."
    }
  };
  return messages[currentLang][tier];
}

function renderEligResult(){
  if(lastEligTier === null) return;
  document.getElementById('result-headline').textContent = eligMessages(lastEligTier);
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.i18n').forEach(function(el){
    if(el.classList.contains('hero-context')) return; // handled separately (contains markup)
    el.textContent = el.dataset[lang];
  });
  renderHeroContext();
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
  const privacyLink = document.getElementById('privacy-link');
  if(privacyLink){
    privacyLink.href = 'privacy-policy.html?lang=' + lang;
  }
  renderEligResult();
}

document.getElementById('btn-en').addEventListener('click', function(){ applyLang('en'); });
document.getElementById('btn-es').addEventListener('click', function(){ applyLang('es'); });

function detectLang(){
  const params = new URLSearchParams(window.location.search);
  const urlLang = params.get('lang');
  if(urlLang === 'es' || urlLang === 'en'){ return urlLang; }
  const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  if(browserLang.startsWith('es')){ return 'es'; }
  return 'en';
}

applyLang(detectLang());

document.getElementById('elig-btn').addEventListener('click', function(){
  const checks = document.querySelectorAll('.elig-check');
  let checkedCount = 0;
  checks.forEach(function(c){ if(c.checked) checkedCount++; });

  let tier;
  if(checkedCount >= 4){ tier = 2; }
  else if(checkedCount >= 2){ tier = 1; }
  else { tier = 0; }

  lastEligTier = tier;
  renderEligResult();
  document.getElementById('result').classList.add('open');
});

document.getElementById('guide-form').addEventListener('submit', async function(e){
  e.preventDefault();

  const submitBtn = document.querySelector('#guide-form button[type="submit"]');
  const originalText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = currentLang === 'es' ? 'Enviando…' : 'Sending…';

  const checks = document.querySelectorAll('.elig-check');
  let checkedCount = 0;
  checks.forEach(function(c){ if(c.checked) checkedCount++; });

  const payload = {
    name: document.getElementById('guide-name').value.trim(),
    email: document.getElementById('guide-email').value.trim(),
    phone: document.getElementById('guide-phone').value.trim(),
    area_of_interest: document.getElementById('guide-area').value,
    eligibility_answers_checked: checkedCount,
    eligibility_tier: lastEligTier,
    language: currentLang,
    source: 'short-sale-guide-request',
    _subject: 'Short sale guide request'
  };

  let ok = false;
  try{
    const response = await fetch('https://formspree.io/f/mrpzegna', {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    ok = response.ok;
  }catch(err){
    ok = false;
  }

  submitBtn.disabled = false;
  submitBtn.textContent = originalText;

  if(ok){
    document.getElementById('guide-form').style.display = 'none';
    document.getElementById('guide-confirmation').classList.add('open');
  } else {
    alert(currentLang === 'es' ? 'Algo salió mal. Intente de nuevo.' : 'Something went wrong. Please try again.');
  }
});
</script>

</body>
</html>
